<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Juegos de Mesa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Luddo store</h1>
    </header>

    <main class="container">
        <h2>Catálogo de Juegos</h2>

        <!-- Filtros de Categoría -->
        <div id="filtros-categoria" class="filtros-container">
            <button class="btn-filtro activo" data-categoria="todos">Todos</button>
            <button class="btn-filtro" data-categoria="clasicos">Clásicos</button>
            <button class="btn-filtro" data-categoria="estrategia">Estrategia</button>
            <button class="btn-filtro" data-categoria="infantiles">Infantiles</button>
            <button class="btn-filtro" data-categoria="familiares">Familiares</button>
            <button class="btn-filtro" data-categoria="fiesta">De Fiesta</button>
        </div>

        
        <div id="catalogo" class="grid-catalogo"></div>
    </main>

    <!--  Detalle Producto -->
    <div id="modal-detalle" class="modal oculto">
        <div class="modal-contenido">
            <button id="cerrar-modal" class="btn-cerrar">&times;</button>
            <div id="detalle-producto"></div>
        </div>
    </div>

    <script src="App.js"></script>
</body>
</html>
